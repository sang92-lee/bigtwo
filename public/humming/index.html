<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d1420"></head><body>
<title>허밍 코치</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap">
<style>
:root{--bg:#0d1420;--panel:#162030;--line:#2a3a52;--mint:#4fe3b0;--yellow:#ffd557;--red:#ff6b6b;--text:#eef4ff;--dim:#8fa3bf}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Gowun Dodum',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;padding:12px 16px 96px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
h1{font-size:20px;margin:0}
button{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer}
button.main{background:var(--mint);color:#06281d;border-color:var(--mint);font-weight:700}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:7px 12px;background:transparent;color:var(--dim)}
.seg button.on{background:var(--mint);color:#06281d;font-weight:700}
#sf{display:flex;gap:6px}
#q{flex:1;min-width:0;font:inherit;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text)}
#results{max-height:210px;overflow:auto;margin-top:6px}
#results button{display:block;width:100%;text-align:left;margin-bottom:4px;padding:7px 10px;font-size:14px}
#results small{color:var(--dim)}
#ytWrap{position:relative;aspect-ratio:16/9;margin-top:8px;border-radius:12px;overflow:hidden;background:#000}
#ytWrap iframe{position:absolute;inset:0;width:100%;height:100%}
#stage{position:relative;margin-top:10px;height:190px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
#cv{width:100%;height:100%;display:block}
#hud{position:absolute;right:10px;top:8px;text-align:right;pointer-events:none}
#total{font-size:40px;font-weight:700;line-height:1}
#combo{color:var(--yellow);font-size:15px;min-height:20px}
#note{color:var(--dim);font-size:13px}
#orb{position:absolute;left:14px;top:14px;width:26px;height:26px;border-radius:50%;background:var(--mint);opacity:.25;transition:transform .12s,opacity .12s,box-shadow .12s}
.bar{display:grid;grid-template-columns:44px 1fr 34px;align-items:center;gap:8px;margin-top:8px;font-size:14px}
.bar i{display:block;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i b{display:block;height:100%;width:0;background:var(--mint);transition:width .12s}
.bar span:last-child{text-align:right;color:var(--dim)}
#msg{min-height:22px;margin-top:10px;font-size:14px;color:var(--yellow)}
footer{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:18px 16px calc(12px + env(safe-area-inset-bottom))}
footer div{max-width:528px;margin:0 auto;display:flex;gap:6px}
footer button{flex:1;padding:12px 6px;font-size:14px}
#res{position:fixed;inset:0;background:rgba(5,9,15,.86);display:none;align-items:center;justify-content:center;padding:16px;z-index:5}
#res.on{display:flex}
#res>div{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;width:100%;max-width:420px}
#res h2{margin:0 0 4px;font-size:18px}
#rBig{font-size:56px;font-weight:700;color:var(--mint);line-height:1.1}
#res table{width:100%;border-collapse:collapse;margin:10px 0;font-size:14px}
#res td{padding:5px 0;border-bottom:1px solid var(--line)}
#res td:last-child{text-align:right}
#rTip{font-size:14px;color:var(--yellow);margin:8px 0 14px}
</style>
<div id="app">
<header><h1>허밍 코치</h1><div class="seg"><button id="mEar">이어폰</button><button id="mSpk">스피커</button></div></header>
<form id="sf"><input id="q" placeholder="노래 제목 또는 유튜브 주소" enterkeyhint="search"><button>찾기</button></form>
<div id="results"></div>
<div id="ytWrap" hidden><div id="yt"></div></div>
<div id="stage"><canvas id="cv"></canvas><div id="orb"></div><div id="hud"><div id="total">--</div><div id="combo"></div><div id="note"></div></div></div>
<div class="bar"><span>울림</span><i><b id="bRes"></b></i><span id="vRes">-</span></div>
<div class="bar"><span>안정</span><i><b id="bStab"></b></i><span id="vStab">-</span></div>
<div class="bar"><span>맑음</span><i><b id="bClear"></b></i><span id="vClear">-</span></div>
<div id="msg"></div>
</div>
<footer><div><button id="start" class="main">마이크 켜기</button><button id="calib">기준 소리 녹음</button><button id="finish">결과 보기</button></div></footer>
<div id="res"><div><h2>이번 연습</h2><div id="rBig"></div><div id="rCmp" style="color:var(--dim);font-size:14px"></div><table id="rTab"></table><div id="rTip"></div><button id="rClose" class="main" style="width:100%">다시 하기</button></div></div>
<script>
/*DSP*/
// 음높이 찾기 (McLeod NSDF). x 길이 4096, 앞 절반을 창으로 쓴다.
function nsdfPitch(x,sr,fmin,fmax,prev){
  const n=x.length,W=n>>1,lo=Math.max(2,Math.floor(sr/fmax)),hi=Math.min(W-2,Math.ceil(sr/fmin));
  let e=0;for(let i=0;i<n;i++)e+=x[i]*x[i];
  const rms=Math.sqrt(e/n),d=new Float32Array(hi+2);
  if(rms<1e-5)return{f0:0,clarity:0,rms};
  for(let t=lo-1;t<=hi+1;t++){let a=0,m=0;for(let i=0;i<W;i++){const p=x[i],q=x[i+t];a+=p*q;m+=p*p+q*q}d[t]=m>0?2*a/m:0}
  let best=0;const pk=[];
  for(let t=lo;t<=hi;t++)if(d[t]>0&&d[t]>d[t-1]&&d[t]>=d[t+1]){pk.push(t);if(d[t]>best)best=d[t]}
  // 직전 음과 가까운 후보가 있으면 그쪽을 믿는다 (반주 때문에 한 옥타브 튀는 것 방지)
  let pick=0;if(prev>0){const pl=sr/prev;for(const t of pk)if(Math.abs(t-pl)<pl*.06&&d[t]>=.75*best&&(!pick||d[t]>d[pick]))pick=t}
  for(const t of pick?[pick]:pk)if(d[t]>=.9*best||t===pick){
    const den=d[t-1]-2*d[t]+d[t+1],off=den?(d[t-1]-d[t+1])/(2*den):0;
    return{f0:sr/(t+off),clarity:d[t],rms};
  }
  return{f0:0,clarity:0,rms};
}
let _fft;
function fftPower(x){
  const n=x.length;
  if(!_fft||_fft.n!==n){
    const w=new Float32Array(n),c=new Float32Array(n/2),s=new Float32Array(n/2),rev=new Uint16Array(n);
    let bits=0;while(1<<bits<n)bits++;
    for(let i=0;i<n;i++){w[i]=.5-.5*Math.cos(2*Math.PI*i/n);let r=0;for(let b=0;b<bits;b++)r|=(i>>b&1)<<(bits-1-b);rev[i]=r}
    for(let i=0;i<n/2;i++){c[i]=Math.cos(2*Math.PI*i/n);s[i]=-Math.sin(2*Math.PI*i/n)}
    _fft={n,w,c,s,rev,re:new Float32Array(n),im:new Float32Array(n),P:new Float32Array(n/2)};
  }
  const{w,c,s,rev,re,im,P}=_fft;
  for(let i=0;i<n;i++){re[rev[i]]=x[i]*w[i];im[i]=0}
  for(let len=2;len<=n;len<<=1){const h=len>>1,st=n/len;
    for(let i=0;i<n;i+=len)for(let j=0;j<h;j++){const k=j*st,a=i+j,b=a+h,tr=re[b]*c[k]-im[b]*s[k],ti=re[b]*s[k]+im[b]*c[k];re[b]=re[a]-tr;im[b]=im[a]-ti;re[a]+=tr;im[a]+=ti}}
  for(let i=0;i<n/2;i++)P[i]=re[i]*re[i]+im[i]*im[i];
  return P;
}
// 배음만 골라서 본다 → 반주가 조금 섞여도 덜 흔들린다.
// ring: 2~4.5kHz 배음 비율(dB), rich: 2번째 이상 배음 / 기본음(dB)
function harmonics(P,f0,sr){
  const n=P.length*2;let tot=0,h1=0,hi=0;
  for(let k=1;k*f0<=5000;k++){
    const b=Math.round(k*f0*n/sr);if(b+3+b/k>=P.length)break;
    let m=b;for(let j=b-2;j<=b+2;j++)if(P[j]>P[m])m=j;
    // 배음 사이 빈 곳의 세기(숨소리·반주)를 빼고 센다
    const lo=Math.round((k-.5)*f0*n/sr),hi2=Math.round((k+.5)*f0*n/sr);
    const fl=(P[lo-1]+P[lo]+P[lo+1]+P[hi2-1]+P[hi2]+P[hi2+1])/2,en=Math.max(0,P[m-1]+P[m]+P[m+1]-fl);tot+=en;if(k===1)h1=en;if(k*f0>=2000&&k*f0<=4500)hi+=en;
  }
  if(!(tot>0)||!(h1>0))return{ring:-70,rich:-40};
  return{ring:10*Math.log10(hi/tot+1e-7),rich:10*Math.log10((tot-h1)/h1+1e-4)};
}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const below=(x,ref)=>clamp(100-Math.max(0,ref-x)*7,0,100);
function scoreFrame(h,clarity,jitter,ref){
  const res=.5*below(h.ring,ref.ring)+.5*below(h.rich,ref.rich);
  const stab=clamp(100-(jitter-6)*2,0,100);
  const clear=clamp((clarity-.86)/.125*100,0,100);
  return{res,stab,clear,total:.5*res+.25*stab+.25*clear};
}
/*END DSP*/

const $=id=>document.getElementById(id),say=t=>$('msg').textContent=t||'';
const DEF={ring:-30,rich:-8};
let mode=localStorage.hum_mode==='spk'?'spk':'ear',ref,ctx,an,src,stream,buf,on=false;
let gate=0,leak=null,leakDone='',calib=null,cents=[],lastVoiced=0,lastF0=0,last=0,center=57,trace=[];
let sm={res:0,stab:0,clear:0,total:0},S,combo=0,goodRun=0,badRun=0;
const newS=()=>({t:0,sum:0,res:0,stab:0,clear:0,good:0,best:0});
S=newS();
function loadRef(){try{ref=JSON.parse(localStorage['hum_ref_'+mode])}catch(e){ref=null}}
function setMode(m){
  mode=m;localStorage.hum_mode=m;$('mEar').className=m==='ear'?'on':'';$('mSpk').className=m==='spk'?'on':'';
  loadRef();gate=0;leakDone='';
  if(on)startMic();else hint();
}
function hint(){
  if(!on)say(mode==='spk'?'스피커 모드: 폰을 입 가까이 두고, 반주는 너무 크지 않게 틀어주세요.':'마이크를 켜고 허밍해 보세요.');
  else if(!ref)say('기준 소리를 먼저 녹음하면 점수가 내 목소리에 맞춰져요.');
  else say('');
}
async function startMic(){
  try{
    if(stream)stream.getTracks().forEach(t=>t.stop());
    stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:mode==='spk',noiseSuppression:false,autoGainControl:false}});
    ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();
    if(src)src.disconnect();
    src=ctx.createMediaStreamSource(stream);an=ctx.createAnalyser();an.fftSize=4096;src.connect(an);buf=new Float32Array(4096);
    if(!on){on=true;requestAnimationFrame(loop)}
    $('start').textContent='마이크 켜짐';$('start').className='';hint();maybeLeak();
  }catch(e){say('마이크를 쓸 수 없어요. 브라우저에서 마이크 권한을 허용해 주세요.')}
}
// 스피커 모드: 반주가 마이크로 얼마나 새는지 3초 재서 그보다 큰 소리만 내 목소리로 본다
function maybeLeak(force){
  if(mode!=='spk'||!on||!player||!player.getPlayerState||player.getPlayerState()!==1)return;
  const id=player.getVideoData().video_id;if(!force&&leakDone===id)return;
  leakDone=id;leak={until:performance.now()/1000+3,v:[]};say('3초만 조용히 해주세요. 반주 소리를 재는 중이에요.');
}
function loop(){
  requestAnimationFrame(loop);
  const now=performance.now()/1000;if(now-last<.03)return;
  const dt=Math.min(.1,now-last);last=now;
  an.getFloatTimeDomainData(buf);
  const p=nsdfPitch(buf,ctx.sampleRate,70,800,now-lastVoiced<.15?lastF0:0);
  if(leak){
    leak.v.push(p.rms);
    if(now>leak.until){leak.v.sort((a,b)=>a-b);const g=leak.v[Math.floor(leak.v.length*.9)]*1.5;gate=Math.min(g,.05);leak=null;
      say(g>.05?'반주가 마이크에 크게 들어와요. 볼륨을 조금 줄이면 더 정확해요.':'준비됐어요. 허밍해 보세요.')}
    draw(now);return;
  }
  const voiced=p.f0>0&&p.rms>Math.max(.006,gate)&&p.clarity>(mode==='spk'?.9:.85);
  if(voiced){
    const h=harmonics(fftPower(buf),p.f0,ctx.sampleRate),c=1200*Math.log2(p.f0/440)+6900;
    if(now-lastVoiced>.15)cents=[];lastVoiced=now;lastF0=p.f0;cents.push(c);if(cents.length>10)cents.shift();
    let j=0;for(let i=2;i<cents.length;i++)j+=Math.abs(cents[i]-2*cents[i-1]+cents[i-2]);
    j=cents.length>2?j/(cents.length-2):6;
    if(calib){calib.v.push(h);}
    const sc=scoreFrame(h,p.clarity,j,ref||DEF);
    for(const k in sm)sm[k]+=(sc[k]-sm[k])*.3;
    center+=(c/100-center)*.03;trace.push({t:now,m:c/100,s:sm.total});
    if(!calib){
      S.t+=dt;S.sum+=sc.total*dt;S.res+=sc.res*dt;S.stab+=sc.stab*dt;S.clear+=sc.clear*dt;
      if(sm.total>=70){S.good+=dt;goodRun+=dt;badRun=0;combo=Math.floor(goodRun/.5);if(combo>S.best)S.best=combo}
      else if(sm.total<55&&(badRun+=dt)>.4){goodRun=0;combo=0}
    }
    hud(c);
  }else if(now-lastVoiced>.4)hud(null);
  if(calib&&now>calib.until)endCalib();
  draw(now);
}
const NAMES=['도','도#','레','레#','미','파','파#','솔','솔#','라','라#','시'];
function hud(c){
  const act=c!==null;
  $('total').textContent=act?Math.round(sm.total):'--';
  $('total').style.color=!act?'var(--dim)':sm.total>=70?'var(--mint)':sm.total>=45?'var(--yellow)':'var(--red)';
  $('combo').textContent=combo>1?combo+' 콤보':'';
  $('note').textContent=act?NAMES[((Math.round(c/100)%12)+12)%12]+(Math.floor(Math.round(c/100)/12)-1):'';
  for(const[k,id]of[['res','Res'],['stab','Stab'],['clear','Clear']]){$('b'+id).style.width=(act?sm[k]:0)+'%';$('v'+id).textContent=act?Math.round(sm[k]):'-'}
  const o=$('orb'),r=act?sm.res/100:0;o.style.transform='scale('+(1+r*1.6)+')';o.style.opacity=.25+r*.75;o.style.boxShadow=r>.7?'0 0 22px var(--mint)':'none';
}
const cv=$('cv'),g=cv.getContext('2d');
function draw(now){
  const dpr=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
  if(cv.width!==w*dpr||cv.height!==h*dpr){cv.width=w*dpr;cv.height=h*dpr}
  g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
  const SPAN=8,R=9,y=m=>h/2-(m-center)/R*(h/2-8),x=t=>w-(now-t)/SPAN*w;
  g.lineWidth=1;
  for(let m=Math.ceil(center-R);m<=center+R;m++){g.strokeStyle=m%12===0?'#3b5073':'#1f2c41';g.beginPath();g.moveTo(0,y(m));g.lineTo(w,y(m));g.stroke()}
  while(trace.length&&now-trace[0].t>SPAN)trace.shift();
  g.lineWidth=4;g.lineCap='round';
  for(let i=1;i<trace.length;i++){const a=trace[i-1],b=trace[i];if(b.t-a.t>.12)continue;
    g.strokeStyle=b.s>=70?'#4fe3b0':b.s>=45?'#ffd557':'#ff6b6b';g.beginPath();g.moveTo(x(a.t),y(a.m));g.lineTo(x(b.t),y(b.m));g.stroke()}
}
function startCalib(){
  if(!on){say('먼저 마이크를 켜주세요.');return}
  if(player&&player.pauseVideo)player.pauseVideo();
  calib={until:performance.now()/1000+5,v:[]};say('지금! 가장 잘 되는 허밍을 5초간 길게 내주세요.');
}
function endCalib(){
  const v=calib.v;calib=null;
  if(v.length<40){say('소리가 너무 짧게 잡혔어요. 다시 녹음해 주세요.');return}
  const med=k=>v.map(o=>o[k]).sort((a,b)=>a-b)[v.length>>1];
  ref={ring:med('ring'),rich:med('rich')};localStorage['hum_ref_'+mode]=JSON.stringify(ref);
  S=newS();combo=goodRun=0;say('기준 소리를 저장했어요. 이 소리에 가까울수록 울림 점수가 높아요.');
}
function finish(){
  if(S.t<3){say('아직 소리가 거의 안 잡혔어요. 조금 더 허밍한 뒤 눌러주세요.');return}
  const a=k=>Math.round(S[k]/S.t),avg=a('sum'),r={res:a('res'),stab:a('stab'),clear:a('clear')};
  let hist=[];try{hist=JSON.parse(localStorage.hum_hist)||[]}catch(e){}
  const prev=hist[hist.length-1];
  $('rBig').textContent=avg+'점';
  $('rCmp').textContent=prev?'지난번 '+prev.avg+'점 → '+(avg>=prev.avg?'+':'')+(avg-prev.avg):'첫 기록이에요';
  const rows=[['울림',r.res],['안정',r.stab],['맑음',r.clear],['좋은 소리 비율',Math.round(S.good/S.t*100)+'%'],['최고 콤보',S.best],['소리 낸 시간',Math.round(S.t)+'초']];
  const tb=$('rTab');tb.textContent='';for(const[k,v]of rows){const tr=tb.insertRow();tr.insertCell().textContent=k;tr.insertCell().textContent=v}
  const low=Object.keys(r).sort((x,y)=>r[x]-r[y])[0];
  $('rTip').textContent={res:'울림이 가장 약했어요. 입술을 가볍게 붙이고 콧등과 앞니 쪽이 간질간질 떨리는지 느끼며 해보세요.',
    stab:'음이 흔들렸어요. 배의 압력을 일정하게 두고 한 음을 길게 버티는 연습이 도움이 돼요.',
    clear:'숨이 섞여 샜어요. 소리를 작게 내더라도 또렷하게 붙여서 내보세요.'}[low];
  hist.push({d:Date.now(),avg,...r});localStorage.hum_hist=JSON.stringify(hist.slice(-30));
  $('res').className='on';S=newS();combo=goodRun=0;
}
// 유튜브
let player,ytReady,pending;
window.onYouTubeIframeAPIReady=()=>{ytReady=true;if(pending)play(pending)};
function play(id){
  $('ytWrap').hidden=false;$('results').textContent='';
  if(!ytReady){pending=id;if(!window.YT){const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s)}return}
  S=newS();combo=goodRun=0;
  if(player&&player.loadVideoById){player.loadVideoById(id);return}
  player=new YT.Player('yt',{videoId:id,playerVars:{playsinline:1,rel:0,autoplay:1},events:{onStateChange:e=>{if(e.data===1)maybeLeak();if(e.data===0&&S.t>=3)finish()}}});
}
$('sf').onsubmit=async e=>{
  e.preventDefault();const q=$('q').value.trim();if(!q)return;$('q').blur();
  const m=q.match(/(?:v=|youtu\.be\/|shorts\/|embed\/)([\w-]{11})/);if(m){play(m[1]);return}
  const box=$('results');box.textContent='찾는 중…';let items=[];
  try{items=await(await fetch('/api/yt?q='+encodeURIComponent(q+' 노래방'))).json()}catch(e){}
  box.textContent='';
  if(!items.length){box.textContent='검색이 안 됐어요. 유튜브 주소를 붙여넣어도 돼요.';return}
  for(const it of items){const b=document.createElement('button'),s=document.createElement('small');b.textContent=it.title+' ';s.textContent=[it.ch,it.len].filter(Boolean).join(' · ');b.appendChild(s);b.onclick=()=>play(it.id);box.appendChild(b)}
};
$('mEar').onclick=()=>setMode('ear');$('mSpk').onclick=()=>setMode('spk');
$('start').onclick=startMic;$('calib').onclick=startCalib;$('finish').onclick=finish;$('rClose').onclick=()=>$('res').className='';
setMode(mode);
</script>
