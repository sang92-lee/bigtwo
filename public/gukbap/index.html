<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15342f"></head><body>

<style>

}

  overscroll-behavior: none; -webkit-user-select: none; user-select: none; font-family: var(--body); touch-action: manipulation }

#street { flex: 1; min-height: 0; position: relative } canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none }

.pot.go i { background: radial-gradient(circle at 34% 38%, #b7795a 0 9%, transparent 10%), radial-gradient(circle at 68% 64%, #b7795a 0 9%, transparent 10%), radial-gradient(circle at 64% 30%, #5aa84f 0 4%, transparent 5%), radial-gradient(circle at 30% 68%, #5aa84f 0 4%, transparent 5%), radial-gradient(circle, #fff3d4 0 68%, #3b2318 70%); color: var(--sign-ink); font-size: 19px; animation: bob .3s infinite alternate } .pot.go { --c: var(--good); box-shadow: 0 0 0 5px var(--sign), 0 0 22px 8px var(--sign) }

#pour { background: var(--tile-deep); color: var(--paper); font: 400 15px/1.1 var(--display); padding: 5px 2px; touch-action: none }
#pour small { display: block; font: 11px var(--body); opacity: .85 } #pour.on { background: var(--sign); color: var(--sign-ink) }
#acts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px }
.act { background: var(--ink); color: var(--paper); padding: 9px 2px; font: 400 16px var(--display); position: relative; overflow: hidden }

#sheet[hidden] { display: none }

td, th { padding: 7px 10px; text-align: right; font-size: 15px; font-weight: 400 } td:first-child, th:first-child { text-align: left } tr + tr td { border-top: 1px solid var(--steel) }

<div id="app">
  <div id="top">
    <div id="score">
      <div><small id="myName">우리집</small><b id="mySales">0원</b></div>

<script id="logic">
/* 게임 규칙: 화면과 분리해 두어 자동 시험으로 끝까지 돌려 볼 수 있다 */
const TYPES = [
  { n: '학생', tag: '싸게', c: '#3a78d8', p: 1.7, t: .5, s: .6 },
  { n: '직장인', tag: '빨리', c: '#444c5c', p: .6, t: .5, s: 1.8 },
  { n: '어르신', tag: '맛', c: '#a0542c', p: .7, t: 1.5, s: .4 },
  { n: '미식가', tag: '맛!!', c: '#8b2fb0', p: .15, t: 2.6, s: .3 },
];
const CHAPTERS = [
  { place: '골목 포장마차', mix: [4, 3, 3, 0], gap: 1.5, rent: 20000, rt: 4.3, rs: 3.6, rp: 8000, banner: 19,
    intro: '할머니가 물려주신 솥 두 개로 포장마차를 열었어요.\n\n그런데 개업 첫날, 바로 옆에 커다란 간판이 올라갑니다.\n\n"반갑소. 옆집 왕대박국밥 왕사장이오.\n이 골목 국밥은 내가 접수하지."' },
  { place: '시장 안 가게', mix: [3, 3, 4, 0], gap: 1.35, rent: 50000, rt: 5.6, rs: 2.8, rp: 8000, banner: 17,
    intro: '골목을 이기고 시장에 번듯한 가게를 얻었어요.\n\n짐을 푸는데 옆 가게 셔터가 올라갑니다.\n\n"또 만났네? 네가 가는 곳 옆엔 언제나 내가 있다."\n\n왕사장이 따라왔어요.' },
  { place: '대학가', mix: [7, 1, 1, 1], gap: 1.2, rent: 80000, rt: 6.2, rs: 2.2, rp: 6500, banner: 15,
    intro: '대학가로 옮겼어요. 손님은 온통 학생입니다.\n\n옆집에 왕사장의 현수막이 걸렸어요.\n\n"국밥 6,500원. 학생은 돈이 없다."\n\n이곳의 승부는 가격이에요.' },
  { place: '오피스 거리', mix: [1, 7, 1, 1], gap: 1.05, rent: 110000, rt: 6.2, rs: 1.6, rp: 8500, banner: 14,
    intro: '점심시간의 오피스 거리. 넥타이 부대는 10분 안에 먹고 나가야 해요.\n\n"3초 국밥 들어갑니다!"\n\n왕사장이 스톱워치를 들고 서 있어요.\n\n이곳의 승부는 속도예요.' },
  { place: '미식 거리', mix: [0, 1, 3, 6], gap: 1.05, rent: 150000, rt: 5, rs: 1.5, rp: 11000, banner: 12,
    intro: '드디어 전국 1등을 가리는 미식 거리.\n\n왕사장이 처음으로 웃지 않습니다.\n\n"국물 한번 먹어 봤다. 그 맛, 어디서 배웠지?"\n\n마지막 승부는 맛이에요.' },
];
const FIRE = [4.4, 3.5, 2.8, 2.2, 1.7];   // 화력 단계별 끓이는 시간
const BROTH = [8, 16, 24, 48, 72];        // 맛 단계별 육수 우린 시간
const COST = { taste: [80000, 200000, 400000, 700000], fire: [70000, 180000, 360000, 640000], pots: [150000, 380000] };
const BROTH_LOW = 35, BROTH_HIGH = 85, BROTH_DRIFT = .7, BROTH_BOWL = 8, BROTH_POUR = 42;
const FINE = 12000, DAY_LEN = 50, GOOD_AGE = 2.2, BURN_AGE = 7, DAYS = 3;
const BANNERS = [
  ['3초 국밥! 앉기도 전에 나옴', '3초면 컵라면도 안 익음'], ['원조 중의 원조', '원조의 원조의 할머니'],
  ['사장이 잘생김', '사장이 더 잘생김'], ['오늘 고기 두 배', '어제 고기도 두 배'], ['깍두기 무한 리필', '깍두기가 맛있어야 무한이지'],
];
const CH_BANNERS = [
  [['포장마차계의 샤넬', '샤넬은 국밥 안 팔아요'], ['소주 한 잔 서비스', '우리 집은 이모가 서비스']],
  [['시장 상인회 추천', '상인회장이 우리 집에서 드심'], ['콩나물 산더미', '옆집 콩나물은 키가 작음']],
  [['학생증 보여주면 500원 할인', '학생증 없어도 학생 대접'], ['리포트 대신 써 드림', '국밥 먹으면 A+']],
  [['회의 전 3분 완식', '회의는 우리 집에서 하세요'], ['법인카드 환영', '법인카드가 먼저 찾는 집']],
  [['미슐랭 별 세 개', '미슐랭 타이어도 우리 단골'], ['육수 100시간', '우리 육수는 할머니 연세만큼']],
];
const CH_TAUNTS = [
  ['포장마차는 비 오면 끝이지?', '이 골목은 내 구역이야'], ['시장 인심은 내가 다 샀어', '네 가게 임대료 얼마야?'],
  ['학생들은 내 편이야', '돈 없으면 머리를 써~'], ['넥타이 부대 다 내 손님', '3초 지났다!'],
  ['네 혀가 내 혀를 이길까?', '국물은 거짓말을 안 해'],
];
const TAUNTS = ['손님 없어 보이네?', '그 국물 맹물 아니야?', '우리 집 줄 보이지?', '문 닫을 때 말해~', '솥 하나 더 빌려줄까?'];

function newGame() { return { ch: 0, day: 0, money: 30000, taste: 0, fire: 0, pots: 2, price: 8000, rep: 0, rp: CHAPTERS[0].rp, weekMe: 0, weekRv: 0, snap: null }; }
const cookTime = g => FIRE[g.fire];
const brothState = d => d.broth < BROTH_LOW ? 'thin' : d.broth > BROTH_HIGH ? 'salty' : 'ok';
const bowlCost = g => 2200 + g.taste * 500;
function snapshot(g) { g.snap = { money: g.money, taste: g.taste, fire: g.fire, pots: g.pots, price: g.price }; }
function restore(g) { g.money = Math.max(g.money, 0) + 30000; g.day = 0; g.weekMe = g.weekRv = 0; g.rep = 0; g.rp = CHAPTERS[g.ch].rp; }

const r0 = () => Math.random();
function startDay(g) {
  const ch = CHAPTERS[g.ch];
  const pots = []; for (let i = 0; i < g.pots; i++) pots.push({ s: 'cook', t: cookTime(g) * (.6 + i * .25), age: 0, cuts: 0 });
  g.d = { t: 0, next: .3, people: [], pots, sales: [0, 0], served: [0, 0], lost: 0, spent: 0, tips: 0, buff: [0, 0], banner: null, bt: ch.banner * .6,
    taunt: 9, cd: { call: 0, rice: 0, steal: 0 }, rs: ch.rs, ev: [], over: false, perfect: 0, stolen: 0, boss: { s: 'away', t: 5 }, raid: null, rt: 8 + r0() * 4, bowls: 3, fly: null, hits: 0, broth: 70, pouring: false, brothState: 'ok' };
}
const queue = (d, shop) => d.people.filter(c => c.shop === shop && c.st === 'queue');
const coming = (d, shop) => d.people.filter(c => c.shop === shop && (c.st === 'queue' || c.st === 'walk')).length;

function choose(g, c, r) {
  const d = g.d, ch = CHAPTERS[g.ch], w = TYPES[c.type];
  const mineServe = (cookTime(g) + .8) / g.pots;
  const val = (taste, price, wait) => w.t * taste + w.p * (9000 - price) / 1000 - w.s * wait / 4;
  const me = val(g.taste + 1.2 + g.rep + { ok: 0, thin: -1.8, salty: -1.2 }[brothState(d)], g.price, coming(d, 0) * mineServe) + (d.buff[0] > 0 ? 2.2 : 0);
  const rv = val(ch.rt, g.rp, coming(d, 1) * d.rs) + (d.buff[1] > 0 ? 2.2 : 0);
  return me + (r() - .5) * 3 >= rv ? 0 : 1;
}

function stepDay(g, dt, r = Math.random) {
  const d = g.d, ch = CHAPTERS[g.ch]; if (d.over) return;
  if (!d.tut) d.t += dt;
  d.next -= dt;
  for (const k in d.cd) d.cd[k] = Math.max(0, d.cd[k] - dt);
  d.buff[0] = Math.max(0, d.buff[0] - dt); d.buff[1] = Math.max(0, d.buff[1] - dt);
  if (d.banner && !d.tut) { d.banner.t -= dt; if (d.banner.t <= 0) d.banner = null; }

  if (d.next <= 0 && d.t < DAY_LEN && (!d.tut || coming(d, d.tutShop) < 3)) {
    d.next = ch.gap * (.65 + r() * .7);
    let roll = r() * ch.mix.reduce((a, b) => a + b), type = 0;
    while (roll >= ch.mix[type]) roll -= ch.mix[type++];
    const c = { type, x: .5, y: 1.02, st: 'walk', shop: 0, wait: 13 + r() * 6, moved: false, id: Math.random() };
    c.shop = d.tutShop ?? choose(g, c, r); d.people.push(c);
  }
  if (!d.tut) d.bt -= dt;
  if (d.bt <= 0) {
    d.bt = ch.banner * (.8 + r() * .4);
    const list = BANNERS.concat(CH_BANNERS[g.ch]), [a, b] = list[Math.floor(r() * list.length)];
    d.banner = { a, b, t: 7, hp: 6 }; d.buff[1] = 7; d.ev.push({ k: 'banner', text: a });
  }
  // 육수는 저절로 졸고, 붓는 동안 차오른다. 짜게 두면 평판이 떨어진다
  if (d.pouring) d.broth = Math.min(100, d.broth + BROTH_POUR * dt);
  else if (!d.tut) d.broth = Math.max(0, d.broth - BROTH_DRIFT * dt);
  const taste = brothState(d);
  if (taste === 'salty' && !d.tut) g.rep = Math.max(-1, g.rep - .03 * dt);
  if (taste !== d.brothState) {
    d.brothState = taste;
    if (taste !== 'ok') d.ev.push({ k: 'broth', text: taste === 'thin' ? '국물이 밍밍해요!' : '너무 짜요!' });
  }
  // 왕사장은 등을 돌렸다가 예고 뒤 노려보고, 건너오는 동안에는 문을 비운다
  const b = d.boss; if (!d.tut) b.t -= dt;
  if (d.raid) b.s = 'away';
  else if (b.t <= 0) {
    if (b.s === 'away') { b.s = 'warn'; b.t = 1; d.ev.push({ k: 'warn' }); }
    else if (b.s === 'warn') { b.s = 'watch'; b.t = 2.6; }
    else { b.s = 'away'; b.t = 4 + r() * 3.5; }
  }
  if (d.fly) {
    d.fly.t -= dt;
    if (d.fly.t <= 0) landBowl(g);
  }
  if (b.s === 'watch') for (const c of d.people) if (c.st === 'held') busted(g, c);
  if (!d.raid && !d.tut) { d.rt -= dt; if (d.rt <= 0) startRaid(d); }
  else if (!d.tut) {
    d.raid.x -= .46 / 3.2 * dt;
    if (d.raid.x <= .3) {
      const head = queue(d, 0)[0];
      if (head) { head.shop = 1; head.st = 'walk'; head.moved = true; head.wait = 10; g.rep = Math.max(-1, g.rep - .05); d.lost++; d.ev.push({ k: 'say', shop: 0, text: '왕사장이 손님을 데려갔어요!' }); }
      endRaid(d, r);
    }
  }
  if (!d.tut) d.taunt -= dt;

const bannerBox = () => [.52, .3, .46, .085];

function drawBowl(d) {
