<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15342f"></head><body>

<style>

:root {

html, body { height: 100%; margin: 0; background: var(--tile-deep); color: var(--ink); overflow: hidden;

#tug { height: 8px; background: var(--rival); overflow: hidden } #tugIn { height: 100%; width: 50%; background: var(--sign); transition: width .3s }

.row header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-variant-numeric: tabular-nums }
.row header b { font: 400 19px var(--display) } .row header span { font-size: 13px; color: var(--rival) }
.row .note { font-size: 13px; opacity: .8 }
.row input { width: 100%; accent-color: var(--sign-ink); height: 28px }
.buy { background: var(--sign); color: var(--sign-ink); padding: 9px; font: 400 16px var(--display) } .buy[disabled] { background: #d6dcdb; color: #6d7a78 }
.main { background: var(--sign); color: var(--sign-ink); padding: 14px; font: 400 21px var(--display); margin-top: auto; flex: none }
.ghost { background: transparent; color: var(--paper); padding: 8px; font-size: 14px; text-decoration: underline; flex: none }
table { width: 100%; border-collapse: collapse; background: var(--paper); color: var(--ink); font-variant-numeric: tabular-nums }
td, th { padding: 7px 10px; text-align: right; font-size: 15px; font-weight: 400 } td:first-child, th:first-child { text-align: left } tr + tr td { border-top: 1px solid var(--steel) }
@media (prefers-reduced-motion: reduce) { .pot.go i, #pour.bad, #finger::before { animation: none } }
</style>

<script id="logic">
/* 게임 규칙: 화면과 분리해 두어 자동 시험으로 끝까지 돌려 볼 수 있다 */

const CHAPTERS = [

  { place: '시장 안 가게', mix: [3, 3, 4, 0], gap: 1.35, rent: 50000, rt: 6.6, rs: 2.2, rp: 8000, banner: 13,
    intro: '골목을 이기고 시장에 번듯한 가게를 얻었어요.\n\n짐을 푸는데 옆 가게 셔터가 올라갑니다.\n\n"또 만났네? 네가 가는 곳 옆엔 언제나 내가 있다."\n\n왕사장이 따라왔어요.' },
  { place: '대학가', mix: [7, 1, 1, 1], gap: 1.2, rent: 80000, rt: 7.2, rs: 1.8, rp: 6500, banner: 12,
    intro: '대학가로 옮겼어요. 손님은 온통 학생입니다.\n\n옆집에 왕사장의 현수막이 걸렸어요.\n\n"국밥 6,500원. 학생은 돈이 없다."\n\n이곳의 승부는 가격이에요.' },
  { place: '오피스 거리', mix: [1, 7, 1, 1], gap: 1.05, rent: 110000, rt: 7.4, rs: 1.3, rp: 8500, banner: 11,
    intro: '점심시간의 오피스 거리. 넥타이 부대는 10분 안에 먹고 나가야 해요.\n\n"3초 국밥 들어갑니다!"\n\n왕사장이 스톱워치를 들고 서 있어요.\n\n이곳의 승부는 속도예요.' },
  { place: '미식 거리', mix: [0, 1, 3, 6], gap: 1.05, rent: 150000, rt: 6.4, rs: 1.3, rp: 11000, banner: 11,
    intro: '드디어 전국 1등을 가리는 미식 거리.\n\n왕사장이 처음으로 웃지 않습니다.\n\n"국물 한번 먹어 봤다. 그 맛, 어디서 배웠지?"\n\n마지막 승부는 맛이에요.' },
];
const FIRE = [4.4, 3.5, 2.8, 2.2, 1.7];   // 화력 단계별 끓이는 시간
const COST = { taste: [120000, 300000, 600000, 1000000], fire: [100000, 260000, 520000, 900000], pots: [200000, 520000] };
const FINE = 12000, DAY_LEN = 50, BURN_AGE = 2, DAYS = 3;
const APPROACH = 1.2, PERFECT = .13, GOOD = .35, LOCK = .5, FLAVOR_UP = .4, FLAVOR_DOWN = 1, FLAVOR_MAX = 3, FLAVOR_PAY = .04, COMBO_PAY = .02, COMBO_PULL = .12;
const BROTH_LOW = 20, BROTH_BOWL = 4, BROTH_POUR = 38, GOLD_NEAR = 5, GOLD_BOWLS = 5, GOLD_PAY = .15, BAD_PAY = .2;

  ['사장이 잘생김', '사장이 더 잘생김'], ['오늘 고기 두 배', '어제 고기도 두 배'], ['깍두기 무한 리필', '깍두기가 맛있어야 무한이지'],
];

  [['포장마차계의 샤넬', '샤넬은 국밥 안 팔아요'], ['소주 한 잔 서비스', '우리 집은 이모가 서비스']],
  [['시장 상인회 추천', '상인회장이 우리 집에서 드심'], ['콩나물 산더미', '옆집 콩나물은 키가 작음']],
  [['학생증 보여주면 500원 할인', '학생증 없어도 학생 대접'], ['리포트 대신 써 드림', '국밥 먹으면 A+']],
  [['회의 전 3분 완식', '회의는 우리 집에서 하세요'], ['법인카드 환영', '법인카드가 먼저 찾는 집']],
  [['미슐랭 별 세 개', '미슐랭 타이어도 우리 단골'], ['육수 100시간', '우리 육수는 할머니 연세만큼']],
];
const CH_TAUNTS = [
  ['포장마차는 비 오면 끝이지?', '이 골목은 내 구역이야'], ['시장 인심은 내가 다 샀어', '네 가게 임대료 얼마야?'],
  ['학생들은 내 편이야', '돈 없으면 머리를 써~'], ['넥타이 부대 다 내 손님', '3초 지났다!'],
  ['네 혀가 내 혀를 이길까?', '국물은 거짓말을 안 해'],
];
const COMPLAINTS = { raw: ['아직 안 익었잖아요! 환불해 주세요', '고기가 살아 있어요!'], late: ['식은 국밥을 누가 먹어요', '국밥이 왜 미지근해요?'], thin: ['국물이 맹물이네', '이게 국밥이에요, 물이에요?'] };
const PRAISES = ['인생 국밥이에요', '할머니 손맛 그대로', '국물이 끝내줘요', '또 올게요!'];
const pick = (list, r = Math.random) => list[Math.floor(r() * list.length)];
const TAUNTS = ['손님 없어 보이네?', '그 국물 맹물 아니야?', '우리 집 줄 보이지?', '문 닫을 때 말해~', '솥 하나 더 빌려줄까?'];

function newGame() { return { ch: 0, day: 0, money: 30000, taste: 0, fire: 0, pots: 2, price: 8000, rep: 0, rp: CHAPTERS[0].rp, weekMe: 0, weekRv: 0, snap: null }; }
const cookTime = g => FIRE[g.fire];
const stars = g => Math.max(1, Math.min(5, 3 + g.rep * 1.33));
const PROMOS = [
  { name: '전단지 돌리기', cost: 15000, fan: [0], note: '학생이 몰려요' },
  { name: '점심 쿠폰', cost: 20000, fan: [1], note: '직장인이 몰려요' },
  { name: '동네 방송', cost: 20000, fan: [2], note: '어르신이 몰려요' },
  { name: '인스타 올리기', cost: 25000, fan: [3], note: '미식가가 몰려요' },
];
const soup = d => d.broth < BROTH_LOW ? 'thin' : 'ok';
const bowlCost = g => 2200 + g.taste * 500;
function snapshot(g) { g.snap = { money: g.money, taste: g.taste, fire: g.fire, pots: g.pots, price: g.price }; }
function restore(g) { g.money = Math.max(g.money, 0) + 30000; g.day = 0; g.weekMe = g.weekRv = 0; g.rep = 0; g.rp = CHAPTERS[g.ch].rp; }

const r0 = () => Math.random();
// 솥마다 끓는 시간과 원의 속도가 달라서 박자가 어긋난다
function recook(g, p) { p.s = 'cook'; p.t = cookTime(g) * (.8 + Math.random() * .5); p.app = .8 + Math.random() * .6; p.delay = 0; p.age = 0; p.cuts = 0; }
function startDay(g) {
  const ch = CHAPTERS[g.ch];
  const pots = []; for (let i = 0; i < g.pots; i++) pots.push({ s: 'cook', t: cookTime(g) * (.6 + i * .25), age: 0, cuts: 0, app: APPROACH, delay: i * .7 });
  g.d = { t: 0, next: .3, people: [], pots, sales: [0, 0], served: [0, 0], lost: 0, spent: 0, tips: 0, buff: [0, 0], banner: null, bt: ch.banner * .6,
    taunt: 9, cd: { call: 0, rice: 0, steal: 0 }, rs: ch.rs, ev: [], over: false, perfect: 0, stolen: 0, boss: { s: 'away', t: 5 }, raid: null, rt: 8 + r0() * 4, bowls: 3, fly: null, hits: 0, complaints: 0, reviews: [], flavor: 0, clean: 8, dirty: 0, promoFan: PROMOS[g.promo]?.fan || [], broth: 70, pouring: false, soup: 'ok', target: 76, gold: 0, combo: 0, best: 0 };
}
