<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>해기 상황판</title>
<style>body{margin:0;background:#070b10;color:#dff4ff;font:16px/1.5 system-ui,sans-serif;padding:24px 16px}b{font-size:56px;display:block;font-weight:900}small{color:#7d9bb0;font-family:ui-monospace,monospace}</style></head>
<body><small>HAEGI MARKET OPS</small><b id="lv">…</b><p id="sub"></p><small id="up"></small>
<script>
const col={'관심':'#3fa9ff','주의':'#ffd23f','경계':'#ff8a2a','심각':'#ff3b4e'};
fetch('market.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{const a=d.alert;const e=document.getElementById('lv');e.textContent=a.level;e.style.color=col[a.level];
document.getElementById('sub').textContent='위험 점수 '+a.score+'/100 · 나쁨 '+a.bad+' · 주의 '+a.warn+' · 좋음 '+a.ok;document.getElementById('up').textContent='갱신 '+d.updated;}).catch(()=>{document.getElementById('lv').textContent='못 읽음'});
</script></body></html>
