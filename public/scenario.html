<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HAEGI SCENARIO OPS</title>
<meta name="description" content="마벨 앞으로 6~12개월 시나리오와 확률, 확률을 바꾸는 신호, 과거 사례">
<meta name="theme-color" content="#05070b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
@font-face{font-family:"Galmuri11";src:url(fonts/Galmuri11.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Galmuri11";src:url(fonts/Galmuri11-Bold.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Galmuri14";src:url(fonts/Galmuri14.woff2) format("woff2");font-display:swap}
@font-face{font-family:"GalmuriMono11";src:url(fonts/GalmuriMono11.woff2) format("woff2");font-display:swap}
/* HAEGI BOARD v2 (2026-11-21): 차분한 픽셀. 픽셀 글꼴은 숫자·이름·라벨만, 본문은 Pretendard. 둥근 카드 + 1px 선 + 칸 막대 */
:root{
  --bg:#090d12;--panel:#0f151c;--panel2:#141c25;--line:#1f2a36;--line2:#2a3846;
  --fg:#e8eef3;--sub:#c3ced8;--dim:#8496a6;--faint:#56687a;
  --cyan:#7fd4e2;--ok:#4fd18b;--warn:#f5c451;--orange:#f59a51;--bad:#ff6b6b;--blue:#72aee3;
  --px:"Galmuri11",ui-monospace,monospace;--big:"Galmuri14","Galmuri11",monospace;--mono:"GalmuriMono11",ui-monospace,Menlo,monospace;
  --read:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --r:16px;color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg);scrollbar-color:var(--line2) var(--bg);scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--read);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom,0px)}
.num,.v,td,.kpi b,.score,.gauge .n{font-variant-numeric:tabular-nums}
::selection{background:var(--warn);color:#000}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
a{color:inherit}
/* 머리줄 */
.hd{position:sticky;top:0;z-index:20;background:rgba(9,13,18,.86);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0px)}
.hd-in{max-width:1120px;margin:0 auto;height:56px;display:flex;align-items:center;gap:20px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.logo{display:flex;align-items:center;gap:9px;font:700 15px var(--px);letter-spacing:.04em;text-decoration:none}
.mark{width:18px;height:18px;flex:none;background:
  linear-gradient(var(--warn),var(--warn)) 0 0/6px 6px no-repeat,linear-gradient(var(--warn),var(--warn)) 12px 0/6px 6px no-repeat,
  linear-gradient(var(--cyan),var(--cyan)) 6px 6px/6px 6px no-repeat,linear-gradient(var(--warn),var(--warn)) 0 12px/18px 6px no-repeat}
.nav{display:flex;gap:4px;margin-left:8px}
.nav a{font-size:14px;color:var(--dim);text-decoration:none;padding:6px 10px;border-radius:8px}
.nav a:hover{color:var(--fg);background:var(--panel2)}
.live{margin-left:auto;display:flex;align-items:center;gap:7px;font:12px var(--mono);color:var(--dim);white-space:nowrap}
.live i{width:6px;height:6px;background:var(--ok);box-shadow:0 0 0 3px rgba(79,209,139,.16)}
/* 판 */
.wrap{max-width:1120px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.px{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0;position:relative;box-shadow:inset 0 1px 0 rgba(255,255,255,.035)}
.px h2,.lb{margin:0 0 12px;font:400 11px var(--px);letter-spacing:.14em;color:var(--faint);display:flex;align-items:center;gap:8px}
.px h2 b,.lb em{font:500 13px var(--read);letter-spacing:0;color:var(--dim);font-style:normal;margin-left:auto}
.sec-t{font:700 13px var(--px);letter-spacing:.12em;color:var(--dim);margin:14px 2px -2px}
/* 경보 */
.hero{padding:22px;background:radial-gradient(110% 90% at 100% 0%,color-mix(in srgb,var(--lv,var(--warn)) 13%,transparent),transparent 62%),var(--panel);
  display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:8px 32px;align-items:end}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.sc{display:flex;align-items:flex-end;gap:10px;margin:2px 0 0}
.score{font:700 clamp(64px,13vw,92px)/.86 var(--px);color:var(--lv,var(--fg))}
.of{font:14px var(--mono);color:var(--faint);margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:7px;font:600 14px var(--read);padding:6px 12px;border-radius:99px;margin:0 0 6px auto;
  color:var(--lv,var(--fg));background:color-mix(in srgb,var(--lv,var(--fg)) 13%,transparent)}
.chip:before{content:"";width:7px;height:7px;background:currentColor}
.meter{display:grid;grid-template-columns:repeat(20,1fr);gap:3px;margin:16px 0 6px}
.meter i{height:12px;background:var(--panel2)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);font-size:11.5px;color:var(--faint);margin-bottom:2px}
.steps span:nth-child(n+2){text-align:center}.steps span:last-child{text-align:right}
.steps span.on{color:var(--lv);font-weight:700}
.msg{margin:0 0 14px;font-size:16px;line-height:1.65;color:var(--sub);max-width:46ch}
.split{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.split div{background:var(--panel2);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--dim)}
.split b{display:block;font:700 22px var(--px);margin-top:2px}
/* 숫자 카드 */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi p{margin:0;font-size:12.5px;color:var(--dim)}
.kpi b{display:block;font:700 24px var(--px);margin:6px 0 4px}
.kpi span{font:11.5px var(--mono)}
/* 시나리오 링크 */
.golink{display:flex;gap:14px;align-items:center;text-decoration:none;padding:16px 18px}
.golink .lb{margin:0}
.golink b{font-size:16px;flex:1;font-weight:600}
.golink .arr{font:700 15px var(--px);color:var(--warn)}
.golink:hover{border-color:var(--line2);background:var(--panel2)}
/* 공포탐욕 */
.fgtop{display:flex;align-items:baseline;gap:10px}
.fgn{font:700 44px/1 var(--px);color:var(--fgc,var(--fg))}
.fgr{font-weight:700;font-size:16px;color:var(--fgc,var(--fg))}
.fgp{font-size:12.5px;color:var(--dim);margin-top:4px}
.fgbar{display:grid;grid-template-columns:repeat(20,1fr);gap:2px;margin:14px 0 4px}
.fgbar i{height:18px}
.pin{position:relative;height:12px}
.pin b{position:absolute;top:0;width:0;height:0;border:6px solid transparent;border-bottom-color:var(--fg);transform:translateX(-6px)}
.fgl{display:flex;justify-content:space-between;font:10.5px var(--px);color:var(--faint);margin-bottom:8px}
/* 줄 */
.rows{display:grid}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line);font-size:14.5px}
.row .v{font:700 15px var(--px);text-align:right}
.tag{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap;text-align:center;min-width:4.4em;background:color-mix(in srgb,currentColor 13%,transparent)}
.c-ok{color:var(--ok)}.c-warn{color:var(--warn)}.c-orange{color:var(--orange)}.c-bad{color:var(--bad)}.c-blue{color:var(--blue)}.c-dim{color:var(--dim)}
.led{width:8px;height:8px;display:inline-block;background:var(--line2);flex:none}
.led.ok{background:var(--ok)}.led.warn{background:var(--warn)}.led.bad{background:var(--bad)}
.ck{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line);font-size:14.5px}
.ck b{font:700 15px var(--px);text-align:right;white-space:nowrap}
/* 계기판 */
.gauge{background:var(--panel2);border-radius:12px;padding:14px;min-width:0}
.gauge .t{font-size:13px;color:var(--dim)}
.gauge .n{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:2px 0 8px}
.gauge .n b{font:700 24px var(--px)}
.gauge .n span{font:12px var(--mono)}
.gauge canvas{width:100%;height:72px;image-rendering:pixelated;display:block}
.gauge p{margin:8px 0 0;font-size:12.5px;color:var(--dim);line-height:1.55}
/* 종목 */
.stk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:14px 0;border-top:1px solid var(--line)}
.stk:first-of-type{border-top:0;padding-top:4px}
.stk .n{font-size:16px;font-weight:700}
.stk .n small{font:11.5px var(--mono);color:var(--faint);margin-left:7px;font-weight:400}
.stk .p{font:700 17px var(--px);text-align:right}
.stk .s{font-size:12.5px;color:var(--dim)}
.stk .d{font:12.5px var(--mono);text-align:right}
.stk.me .n{color:var(--warn)}
.hb{grid-column:1/-1;display:grid;grid-template-columns:repeat(25,1fr);gap:2px;margin-top:8px}
.hb i{height:5px;background:var(--panel2)}.hb i.f{background:var(--bad)}
.stocks2{display:grid;gap:0 32px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.stocks2 .stk,.stocks2 .stk:first-of-type{border-top:0;border-bottom:1px solid var(--line);padding:12px 0 14px}
/* 표 (시나리오 페이지도 씀) */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font:400 11px var(--px);letter-spacing:.08em;color:var(--faint);padding:8px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:11px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
tr.me td:first-child{color:var(--warn)}
td.hot{color:var(--bad);font-weight:700}
/* 위험도 */
.risk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:12px 0;border-top:1px solid var(--line);font-size:14.5px}
.risk:first-of-type{border-top:0;padding-top:0}
.risk > b{font:700 15px var(--px)}
.segs{grid-column:1/-1;display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:2px}
.segs i{height:8px;background:var(--panel2)}
.risk small{grid-column:1/-1;color:var(--dim);font-size:12.5px;line-height:1.55}
/* 일정·산업 */
.list .it{display:grid;grid-template-columns:62px minmax(0,1fr);gap:3px 14px;padding:12px 0;border-top:1px solid var(--line)}
.list .it:first-child{border-top:0;padding-top:0}
.when{font:700 14px var(--px);color:var(--cyan);line-height:1.35}
.when small{display:block;font:11px var(--mono);color:var(--faint);margin-top:3px;font-weight:400}
.list .it b{font-size:15px;font-weight:600}
.list .it span.d{grid-column:2;font-size:13px;color:var(--dim);line-height:1.55}
.list .it span.d em{color:var(--ok);font-style:normal;font-weight:600}
.list.ind .it{grid-template-columns:auto minmax(0,1fr)}
.list.ind .tag{align-self:center}
footer{font-size:12px;color:var(--faint);line-height:1.8;padding:8px 2px 0}
footer a{color:var(--dim)}
.err{color:var(--bad)}
/* 폰: 아래 탭 */
.tabs{display:none}
@media (max-width:720px){
  .nav{display:none}
  .tabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;justify-content:space-around;background:rgba(9,13,18,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    border-top:1px solid var(--line);padding:9px 0 calc(9px + env(safe-area-inset-bottom,0px))}
  .tabs a{display:flex;flex-direction:column;align-items:center;gap:5px;font:11px var(--px);color:var(--faint);text-decoration:none;min-width:64px}
  .tabs a i{width:16px;height:16px;border:2px solid currentColor}
  .tabs a.on{color:var(--warn)}
  .tabs a.on i{background:currentColor}
  .wrap{padding-bottom:96px}
  .golink .lb{display:none}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
<style>
.back{color:var(--cyan);text-decoration:none;font-family:var(--mono);font-size:12px;letter-spacing:.1em;border:3px solid var(--line2);padding:4px 10px;display:inline-block}
.back:hover{background:var(--line)}
.sub{color:var(--dim);margin:4px 0 0;max-width:70ch}
/* 확률 막대 */
.stack{display:flex;height:44px;border:3px solid var(--line);background:#03060a;margin-top:6px}
.stack div{display:flex;align-items:center;justify-content:center;color:#000;font-weight:700;font-size:13px;min-width:0;overflow:hidden;white-space:nowrap;border-right:3px solid #03060a}
.stack div:last-child{border-right:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:13px}
.legend span{display:flex;align-items:center;gap:6px}
.sq{width:12px;height:12px;display:inline-block;flex:none}
.bg-ok{background:var(--ok)}.bg-warn{background:var(--warn)}.bg-orange{background:var(--orange)}.bg-bad{background:var(--bad)}.bg-blue{background:var(--blue)}
.big{font-family:var(--big);font-size:30px;line-height:1}
/* 갈림길 */
.fork .opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:8px 0}
.fork .opt{border:3px solid currentColor;padding:8px;text-align:center}
.fork .opt b{display:block;font-family:var(--big);font-weight:400;font-size:28px;line-height:1.1}
.fork p{margin:0;color:var(--dim);font-size:13px}
/* 다섯 길 */
.path{border-left:8px solid currentColor}
.path .head{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;justify-content:space-between}
.path .head h3{margin:0;font-family:var(--big);font-weight:400;font-size:24px;color:var(--fg)}
.path .pct{font-family:var(--big);font-size:40px;line-height:1}
.kv{display:grid;grid-template-columns:5.5em minmax(0,1fr);gap:4px 12px;margin:10px 0;font-size:14px}
.kv dt{color:var(--dim);font-family:var(--mono);font-size:12px;padding-top:2px}
.kv dd{margin:0}
.path ol{margin:6px 0 10px;padding-left:1.4em}
.path ol li{margin:3px 0}
.feel{border:2px dashed var(--line2);padding:8px 10px;color:var(--fg);font-size:13px;margin:0}
.feel::before{content:"▶ ";color:currentColor}
/* 기간 */
.hz{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.hz .gauge b{font-family:var(--big);font-weight:400;font-size:40px}
.meter{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:2px;margin:8px 0}
.meter i{height:14px;background:#17283a}
.meter i.on{background:var(--ok)}
/* 신호 */
.sig{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding-block:10px;border-top:2px dashed var(--line)}
.sig small{grid-column:2/-1;color:var(--dim);font-size:12px}
.lessons{margin:12px 0 0;padding-left:1.2em}
.lessons li{margin:4px 0}
td.wrapc{white-space:normal;min-width:12em}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <a class="back" href="./">◀ 상황판으로</a>
    <span>SCENARIO · 업데이트 <span class="clock" id="upd">—</span></span>
  </div>
  <div>
    <h1>앞으로 <span>시나리오</span></h1>
    <p class="sub" id="sub"></p>
  </div>

  <section class="px">
    <h2>PROBABILITY <b>다섯 갈래 길</b></h2>
    <div class="stack" id="stack" role="img"></div>
    <div class="legend" id="legend"></div>
  </section>

  <div class="grid" id="forks"></div>

  <div id="paths" style="display:grid;gap:22px"></div>

  <section class="px">
    <h2>HORIZON <b>기준가보다 높을 확률</b></h2>
    <div class="hz" id="hz"></div>
  </section>

  <section class="px">
    <h2>SIGNALS <b>확률을 바꾸는 신호</b></h2>
    <div id="sigs"></div>
  </section>

  <section class="px">
    <h2>REAL DATA <b>지금처럼 급락·급공포였던 9번과 3개월 뒤</b></h2>
    <div class="tw"><table><thead><tr><th>이번 하락</th><th>고점 대비</th><th>1주</th><th>1달</th></tr></thead><tbody id="drop"></tbody></table></div>
    <div class="tw" style="margin-top:16px"><table><thead><tr id="anh"></tr></thead><tbody id="anb"></tbody></table></div>
    <ol class="lessons" id="ans"></ol>
    <p class="sub" style="font-size:12px" id="anc"></p>
  </section>

  <section class="px">
    <h2>HISTORY <b>공포 뒤에 무슨 일이 있었나</b></h2>
    <div class="tw"><table><thead><tr><th>언제</th><th>무슨 일</th><th>공포 크기</th><th>금리</th><th>그 뒤</th></tr></thead><tbody id="hist"></tbody></table></div>
    <ol class="lessons" id="lessons"></ol>
  </section>

  <footer>
    <span id="note"></span><br>
    개인 공부용이에요. 투자 권유가 아니에요. 과거 숫자는 대략치예요.<br>
    FONT · Galmuri by Lee Minseo (OFL 1.1)
  </footer>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const C = {ok:'var(--ok)', warn:'var(--warn)', orange:'var(--orange)', bad:'var(--bad)', blue:'var(--blue)'};
async function get(u){ const r = await fetch(u + '?t=' + Date.now()); if (!r.ok) throw new Error(u); return r.json(); }
(async () => {
  let s, m = null;
  try { s = await get('scenarios.json'); } catch (e) { $('sub').innerHTML = '<span class="err">시나리오 파일을 못 읽었어요.</span>'; return; }
  try { m = await get('market.json'); } catch (e) {}
  $('upd').textContent = s.updated.replace('T', ' ').slice(0, 16);
  $('sub').textContent = `${s.subject} · 기준가 $${s.base_price} · ${s.horizon}`;
  $('note').textContent = s.note;
  // 막대
  $('stack').setAttribute('aria-label', s.paths.map(p => `${p.name} ${p.prob}%`).join(', '));
  $('stack').innerHTML = s.paths.map(p => `<div class="bg-${p.tone}" style="flex:${p.prob}">${p.prob >= 10 ? p.prob + '%' : ''}</div>`).join('');
  $('legend').innerHTML = s.paths.map(p => `<span><i class="sq bg-${p.tone}"></i>${esc(p.name)} ${p.prob}%</span>`).join('');
  // 갈림길
  $('forks').innerHTML = s.forks.map((f, i) => {
    let dd = '';
    if (f.when) { const d = Math.ceil((new Date(f.when + 'T00:00:00+09:00') - Date.now()) / 864e5); if (d >= 0) dd = `<span class="dday">D-${d}</span>`; }
    return `<section class="px fork"><h2>FORK ${i + 1} <b>${esc(f.name)}</b>${dd}</h2>
      <div class="opts">${f.opts.map(([n, p, t]) => `<div class="opt c-${t}">${esc(n)}<b>${p}%</b></div>`).join('')}</div>
      <p>${esc(f.how)}</p></section>`;
  }).join('');
  // 다섯 길
  $('paths').innerHTML = s.paths.map((p, i) => `<section class="px path c-${p.tone}">
    <div class="head"><h3>${i + 1}. ${esc(p.name)}</h3><span class="pct">${p.prob}%</span></div>
    <dl class="kv"><dt>조건</dt><dd>${esc(p.cond)}</dd><dt>가격대</dt><dd>${esc(p.range)} <span class="c-dim">(12개월 안 대략)</span></dd><dt>닮은 과거</dt><dd>${esc(p.analog)}</dd></dl>
    <ol style="color:var(--fg)">${p.flow.map(x => `<li>${esc(x)}</li>`).join('')}</ol>
    <p class="feel">${esc(p.feel)}</p></section>`).join('');
  // 기간
  $('hz').innerHTML = s.horizons.map(h => { const n = Math.round(h.up / 5);
    return `<div class="gauge"><div class="t">${esc(h.when)}</div><b class="${h.up >= 60 ? 'c-ok' : 'c-warn'}">${h.up}%</b>
      <div class="meter">${Array.from({length: 20}, (_, k) => `<i class="${k < n ? 'on' : ''}"></i>`).join('')}</div><p>${esc(h.why)}</p></div>`; }).join('');
  // 신호
  const sv = id => { const r = m && m.sentiment.find(x => x.id === id); return r ? parseFloat(r.value) : null; };
  const mv = id => { const r = m && m.macro_now.find(x => x.series === id); return r ? r.last : null; };
  const live = {
    calm: () => { const f = sv('fg'), v = sv('vix'); return f == null ? null : {on: f >= 25 && v <= 25, now: `지금 공포·탐욕 ${f} · VIX ${v}`}; },
    rate5: () => { const u = mv('ust10'); return u == null ? null : {on: u >= 5, now: `지금 10년물 ${u}%`}; }
  };
  $('sigs').innerHTML = s.signals.map(g => {
    let led = '', tag = '', now = '';
    if (g.kind === 'live' && live[g.id]) { const r = live[g.id](); if (r) { led = r.on ? 'warn' : ''; tag = r.on ? '<span class="tag c-warn">켜짐</span>' : '<span class="tag c-dim">꺼짐</span>'; now = ' · ' + r.now; } else tag = '<span class="tag c-dim">못 읽음</span>'; }
    else { const on = g.state === 'on'; led = on ? 'warn' : ''; tag = on ? '<span class="tag c-warn">켜짐</span>' : g.state === 'off' ? '<span class="tag c-dim">아님</span>' : '<span class="tag c-blue">대기</span>'; }
    return `<div class="sig"><i class="led ${led}"></i><b>${esc(g.label)}</b>${tag}<small>→ ${esc(g.effect)}${esc(now)}</small></div>`;
  }).join('');
  // 실제 데이터 9번
  const cl = x => /^\+/.test(x) ? 'c-ok' : /^-/.test(x) ? 'c-bad' : '';
  if (s.analogs) { const a = s.analogs;
    $('drop').innerHTML = a.drop.map(r => `<tr><td>${esc(r[0])}</td><td class="c-bad">${esc(r[1])}</td><td class="c-bad">${esc(r[2])}</td><td class="c-bad">${esc(r[3])}</td></tr>`).join('');
    $('anh').innerHTML = a.cols.map(c => `<th>${esc(c)}</th>`).join('');
    $('anb').innerHTML = `<tr class="me">${a.now.map((x, i) => `<td${i >= 5 ? ' class="c-warn"' : ''}>${esc(x)}</td>`).join('')}</tr>` +
      a.rows.map(r => `<tr>${r.map((x, i) => `<td class="${i >= 5 ? cl(x) : ''}">${esc(x)}</td>`).join('')}</tr>`).join('');
    $('ans').innerHTML = a.summary.map(x => `<li>${esc(x)}</li>`).join('');
    $('anc').textContent = a.criteria; }
  // 과거
  $('hist').innerHTML = s.history.map(h => `<tr><td>${esc(h[0])}</td><td class="wrapc">${esc(h[1])}</td><td class="wrapc">${esc(h[2])}</td><td class="wrapc">${esc(h[3])}</td><td class="wrapc c-${h[5]}">${esc(h[4])}</td></tr>`).join('');
  $('lessons').innerHTML = s.lessons.map(x => `<li>${esc(x)}</li>`).join('');
})();
</script>
</body>
</html>
