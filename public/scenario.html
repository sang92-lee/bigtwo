<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HAEGI SCENARIO OPS</title>
<meta name="description" content="마벨 앞으로 6~12개월 시나리오와 확률, 확률을 바꾸는 신호, 과거 사례">
<meta name="theme-color" content="#05070b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
@font-face{font-family:"Galmuri11";src:url(fonts/Galmuri11.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Galmuri11";src:url(fonts/Galmuri11-Bold.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Galmuri14";src:url(fonts/Galmuri14.woff2) format("woff2");font-display:swap}
@font-face{font-family:"GalmuriMono11";src:url(fonts/GalmuriMono11.woff2) format("woff2");font-display:swap}
:root{
  /* 레이아웃: CRT 관제실 모니터 한 대. 위 경보판 → 숫자 띠 → 계기판 → 칸별 경고등 → 표 */
  --bg:#05070b;--crt:#081019;--panel:#0c1621;--panel2:#101e2b;--line:#1d3446;--line2:#2b4a62;
  --fg:#e6f7ff;--dim:#6f90a6;--cyan:#3ff0ff;--ok:#3ee07f;--warn:#ffd23f;--orange:#ff8a2a;--bad:#ff3b4e;--blue:#3fa9ff;
  --px:"Galmuri11",system-ui,sans-serif;--big:"Galmuri14","Galmuri11",system-ui,sans-serif;--mono:"GalmuriMono11",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--px);font-size:14px;line-height:1.55;-webkit-font-smoothing:none;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:1180px;margin:0 auto;padding-block:14px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
.bar{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:12px;color:var(--dim);letter-spacing:.06em}
.bar .brand{color:var(--cyan);display:flex;gap:8px;align-items:center}
.rec{width:10px;height:10px;background:var(--bad);display:inline-block}
.bar .clock{color:var(--fg)}
h1{font-family:var(--big);font-weight:400;font-size:clamp(26px,6vw,44px);line-height:1.1;margin:2px 0 0;letter-spacing:.01em}
h1 span{color:var(--cyan)}
.px{background:var(--panel);border:3px solid var(--line);box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--line),8px 8px 0 6px #000;padding:16px;min-width:0;position:relative}
.px h2{margin:0 0 10px;font-family:var(--mono);font-weight:400;font-size:12px;letter-spacing:.16em;color:var(--dim);display:flex;gap:10px;align-items:center}
.px h2 b{font-family:var(--px);letter-spacing:0;color:var(--fg);font-size:15px}
.grid{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
/* 경보판 */
.alert{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center;border-color:var(--lv,var(--line));box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--lv,var(--line)),8px 8px 0 6px #000}
@media (max-width:560px){.alert{grid-template-columns:1fr;justify-items:start}}
#siren{width:150px;height:150px;image-rendering:pixelated;display:block}
.lab{font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--dim)}
.level{font-family:var(--big);font-size:clamp(64px,16vw,120px);line-height:1;color:var(--lv,var(--fg));margin:6px 0 12px}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;max-width:520px}
.steps span{text-align:center;padding:7px 2px;border:3px solid var(--line);color:var(--dim);font-weight:700}
.steps span.on{color:#000;border-color:transparent;background:var(--lv)}
.meta{font-family:var(--mono);color:var(--dim);margin:12px 0 0}
.meta b{color:var(--fg);font-weight:400}
.msg{margin:8px 0 0;font-size:16px;max-width:60ch}
/* 숫자 띠 */
.ticker{overflow:hidden;border-block:3px solid var(--line);background:#03060a;white-space:nowrap;padding-block:9px;font-family:var(--mono);font-size:14px}
.track{display:inline-flex;gap:34px;padding-left:16px}
.track .l{color:var(--dim);margin-right:8px}
/* 공포탐욕 */
.fg{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
@media (max-width:560px){.fg{grid-template-columns:1fr}}
#dial{width:240px;height:140px;image-rendering:pixelated;display:block;max-width:100%}
.fgn{font-family:var(--big);font-size:56px;line-height:1;color:var(--fgc,var(--fg))}
.fgr{font-weight:700;font-size:18px;color:var(--fgc,var(--fg))}
.fgp{font-family:var(--mono);font-size:12px;color:var(--dim)}
.rows{display:grid}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding-block:8px;border-top:2px dashed var(--line)}
.row .v{font-family:var(--mono);font-size:15px;text-align:right}
.tag{font-size:11px;font-weight:700;padding:2px 6px;border:2px solid currentColor;min-width:4.4em;text-align:center;white-space:nowrap}
.c-ok{color:var(--ok)}.c-warn{color:var(--warn)}.c-orange{color:var(--orange)}.c-bad{color:var(--bad)}.c-blue{color:var(--blue)}.c-dim{color:var(--dim)}
/* 계기판 */
.gauge{background:var(--panel2);border:3px solid var(--line);padding:12px;min-width:0}
.gauge .t{font-weight:700;color:var(--dim)}
.gauge .n{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:2px 0 8px}
.gauge .n b{font-family:var(--big);font-weight:400;font-size:34px}
.gauge .n span{font-family:var(--mono);font-size:13px}
.gauge canvas{width:100%;height:84px;image-rendering:pixelated;display:block}
.gauge p{margin:8px 0 0;font-size:12px;color:var(--dim)}
/* 칸별 경고등 */
.led{width:14px;height:14px;display:inline-block;background:#243443;flex:none}
.led.ok{background:var(--ok)}
.led.warn{background:var(--warn)}
.led.bad{background:var(--bad)}
/* 표 */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-family:var(--mono);font-weight:400;font-size:11px;letter-spacing:.1em;color:var(--dim);padding:6px 8px;border-bottom:3px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:2px dashed var(--line);white-space:nowrap;font-family:var(--mono)}
td:first-child{font-family:var(--px);font-weight:700}
tr.me td:first-child{color:var(--warn)}
td.hot{background:var(--bad);color:#000}
/* 위험도 */
.risk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding-block:6px}
.segs{grid-column:1/-1;display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:2px}
.segs i{height:12px;background:#17283a}
.risk small{grid-column:1/-1;color:var(--dim);font-size:12px}
.dday{font-family:var(--mono);background:var(--warn);color:#000;padding:1px 6px;margin-left:8px}
.list .it{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding-block:9px;border-top:2px dashed var(--line)}
.list .it b{font-size:14px}
.list .it span.d{grid-column:2;font-size:12px;color:var(--dim)}
footer{font-family:var(--mono);font-size:11px;color:var(--dim);line-height:1.8;letter-spacing:.03em}
footer a{color:var(--dim)}
.err{color:var(--bad);font-family:var(--mono)}
/* 부팅 화면 */
#boot{position:fixed;inset:0;z-index:60;background:#000;color:var(--cyan);font-family:var(--mono);font-size:14px;padding:max(24px,env(safe-area-inset-top,0px)) 20px;white-space:pre-line;transition:opacity .35s}
#boot.out{opacity:0;pointer-events:none}
@media (prefers-reduced-motion:no-preference){
  .rec{animation:blink 1.1s steps(1) infinite}
  .led.bad{animation:blink 1s steps(1) infinite}
  #siren.on{animation:blink .8s steps(1) infinite}
}
@keyframes blink{50%{opacity:.25}}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.golink{display:flex;gap:14px;align-items:center;text-decoration:none;color:var(--fg);border-color:var(--warn);box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--warn),8px 8px 0 6px #000}
.golink b{font-size:17px;flex:1}.golink .arr{color:var(--warn);font-size:20px}.golink:hover{background:var(--panel2)}
/* 읽기 편하게 (2026-11-21): 긴 글은 일반 글꼴, 픽셀 글꼴은 큰 숫자·제목만, 줄무늬 제거, 흐린 글자 밝게, 작은 글자 키움 */
:root{--dim:#a9c2d3;--read:"Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif}
body{font-family:var(--read);font-size:15.5px;line-height:1.7;-webkit-font-smoothing:antialiased}
.px h2,.lab,.bar,th,footer,.fgp,.meta{font-family:var(--read);letter-spacing:.02em}
.px h2{font-size:13px}.px h2 b{font-size:16px}
.lab,.bar,.fgp{font-size:13px}
th{font-size:12.5px}td{font-family:var(--read);font-size:14.5px}
td:first-child{font-family:var(--read)}
.gauge p,.risk small,.list .it span.d{font-size:13.5px;line-height:1.6}
.tag{font-size:12px}footer{font-size:12.5px}
.msg{font-size:17px;line-height:1.65}
.list .it b{font-size:15px}.golink b{font-size:17px}
/* 차분하게 (2026-11-21, impeccable quieter): 빛 번짐·깜빡임·흐르는 띠·두꺼운 그림자 제거, 색 채도 낮춤. 픽셀 제목·경보 단계는 그대로 */
:root{--bg:#0b1117;--panel:#111a23;--panel2:#16212c;--line:#243444;--line2:#2f4457;
  --fg:#e3edf3;--cyan:#82cfdc;--ok:#62c98d;--warn:#e2c15e;--orange:#e39553;--bad:#e2656f;--blue:#72aee3}
.px,.alert,.golink{border-width:2px;box-shadow:none}
.alert{border-color:var(--lv,var(--line))}
.golink{border-color:var(--warn)}
h1,.level{text-shadow:none}
.row,.list .it,td{border-top-style:solid;border-width:1px}
td{border-top:0;border-bottom:1px solid var(--line)}
th{border-bottom-width:2px}
.steps span{border-width:2px}
.gauge{border-width:2px}
.ticker{border-block-width:1px;overflow-x:auto;scrollbar-width:none}
.ticker::-webkit-scrollbar{display:none}
.rec,.led.bad,#siren.on{animation:none!important}
.track{transform:none!important}
.v,td,.gauge .n,.fgn,.level,.meta{font-variant-numeric:tabular-nums}
::selection{background:var(--warn);color:#000}
html{scrollbar-color:var(--line2) var(--bg)}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
</style>
<style>
.back{color:var(--cyan);text-decoration:none;font-family:var(--mono);font-size:12px;letter-spacing:.1em;border:3px solid var(--line2);padding:4px 10px;display:inline-block}
.back:hover{background:var(--line)}
.sub{color:var(--dim);margin:4px 0 0;max-width:70ch}
/* 확률 막대 */
.stack{display:flex;height:44px;border:3px solid var(--line);background:#03060a;margin-top:6px}
.stack div{display:flex;align-items:center;justify-content:center;color:#000;font-weight:700;font-size:13px;min-width:0;overflow:hidden;white-space:nowrap;border-right:3px solid #03060a}
.stack div:last-child{border-right:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:13px}
.legend span{display:flex;align-items:center;gap:6px}
.sq{width:12px;height:12px;display:inline-block;flex:none}
.bg-ok{background:var(--ok)}.bg-warn{background:var(--warn)}.bg-orange{background:var(--orange)}.bg-bad{background:var(--bad)}.bg-blue{background:var(--blue)}
.big{font-family:var(--big);font-size:30px;line-height:1}
/* 갈림길 */
.fork .opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:8px 0}
.fork .opt{border:3px solid currentColor;padding:8px;text-align:center}
.fork .opt b{display:block;font-family:var(--big);font-weight:400;font-size:28px;line-height:1.1}
.fork p{margin:0;color:var(--dim);font-size:13px}
/* 다섯 길 */
.path{border-left:8px solid currentColor}
.path .head{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;justify-content:space-between}
.path .head h3{margin:0;font-family:var(--big);font-weight:400;font-size:24px;color:var(--fg)}
.path .pct{font-family:var(--big);font-size:40px;line-height:1}
.kv{display:grid;grid-template-columns:5.5em minmax(0,1fr);gap:4px 12px;margin:10px 0;font-size:14px}
.kv dt{color:var(--dim);font-family:var(--mono);font-size:12px;padding-top:2px}
.kv dd{margin:0}
.path ol{margin:6px 0 10px;padding-left:1.4em}
.path ol li{margin:3px 0}
.feel{border:2px dashed var(--line2);padding:8px 10px;color:var(--fg);font-size:13px;margin:0}
.feel::before{content:"▶ ";color:currentColor}
/* 기간 */
.hz{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.hz .gauge b{font-family:var(--big);font-weight:400;font-size:40px}
.meter{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:2px;margin:8px 0}
.meter i{height:14px;background:#17283a}
.meter i.on{background:var(--ok)}
/* 신호 */
.sig{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding-block:10px;border-top:2px dashed var(--line)}
.sig small{grid-column:2/-1;color:var(--dim);font-size:12px}
.lessons{margin:12px 0 0;padding-left:1.2em}
.lessons li{margin:4px 0}
td.wrapc{white-space:normal;min-width:12em}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <a class="back" href="./">◀ 상황판으로</a>
    <span>SCENARIO · 업데이트 <span class="clock" id="upd">—</span></span>
  </div>
  <div>
    <h1>앞으로 <span>시나리오</span></h1>
    <p class="sub" id="sub"></p>
  </div>

  <section class="px">
    <h2>PROBABILITY <b>다섯 갈래 길</b></h2>
    <div class="stack" id="stack" role="img"></div>
    <div class="legend" id="legend"></div>
  </section>

  <div class="grid" id="forks"></div>

  <div id="paths" style="display:grid;gap:22px"></div>

  <section class="px">
    <h2>HORIZON <b>기준가보다 높을 확률</b></h2>
    <div class="hz" id="hz"></div>
  </section>

  <section class="px">
    <h2>SIGNALS <b>확률을 바꾸는 신호</b></h2>
    <div id="sigs"></div>
  </section>

  <section class="px">
    <h2>REAL DATA <b>지금처럼 급락·급공포였던 9번과 3개월 뒤</b></h2>
    <div class="tw"><table><thead><tr><th>이번 하락</th><th>고점 대비</th><th>1주</th><th>1달</th></tr></thead><tbody id="drop"></tbody></table></div>
    <div class="tw" style="margin-top:16px"><table><thead><tr id="anh"></tr></thead><tbody id="anb"></tbody></table></div>
    <ol class="lessons" id="ans"></ol>
    <p class="sub" style="font-size:12px" id="anc"></p>
  </section>

  <section class="px">
    <h2>HISTORY <b>공포 뒤에 무슨 일이 있었나</b></h2>
    <div class="tw"><table><thead><tr><th>언제</th><th>무슨 일</th><th>공포 크기</th><th>금리</th><th>그 뒤</th></tr></thead><tbody id="hist"></tbody></table></div>
    <ol class="lessons" id="lessons"></ol>
  </section>

  <footer>
    <span id="note"></span><br>
    개인 공부용이에요. 투자 권유가 아니에요. 과거 숫자는 대략치예요.<br>
    FONT · Galmuri by Lee Minseo (OFL 1.1)
  </footer>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const C = {ok:'var(--ok)', warn:'var(--warn)', orange:'var(--orange)', bad:'var(--bad)', blue:'var(--blue)'};
async function get(u){ const r = await fetch(u + '?t=' + Date.now()); if (!r.ok) throw new Error(u); return r.json(); }
(async () => {
  let s, m = null;
  try { s = await get('scenarios.json'); } catch (e) { $('sub').innerHTML = '<span class="err">시나리오 파일을 못 읽었어요.</span>'; return; }
  try { m = await get('market.json'); } catch (e) {}
  $('upd').textContent = s.updated.replace('T', ' ').slice(0, 16);
  $('sub').textContent = `${s.subject} · 기준가 $${s.base_price} · ${s.horizon}`;
  $('note').textContent = s.note;
  // 막대
  $('stack').setAttribute('aria-label', s.paths.map(p => `${p.name} ${p.prob}%`).join(', '));
  $('stack').innerHTML = s.paths.map(p => `<div class="bg-${p.tone}" style="flex:${p.prob}">${p.prob >= 10 ? p.prob + '%' : ''}</div>`).join('');
  $('legend').innerHTML = s.paths.map(p => `<span><i class="sq bg-${p.tone}"></i>${esc(p.name)} ${p.prob}%</span>`).join('');
  // 갈림길
  $('forks').innerHTML = s.forks.map((f, i) => {
    let dd = '';
    if (f.when) { const d = Math.ceil((new Date(f.when + 'T00:00:00+09:00') - Date.now()) / 864e5); if (d >= 0) dd = `<span class="dday">D-${d}</span>`; }
    return `<section class="px fork"><h2>FORK ${i + 1} <b>${esc(f.name)}</b>${dd}</h2>
      <div class="opts">${f.opts.map(([n, p, t]) => `<div class="opt c-${t}">${esc(n)}<b>${p}%</b></div>`).join('')}</div>
      <p>${esc(f.how)}</p></section>`;
  }).join('');
  // 다섯 길
  $('paths').innerHTML = s.paths.map((p, i) => `<section class="px path c-${p.tone}">
    <div class="head"><h3>${i + 1}. ${esc(p.name)}</h3><span class="pct">${p.prob}%</span></div>
    <dl class="kv"><dt>조건</dt><dd>${esc(p.cond)}</dd><dt>가격대</dt><dd>${esc(p.range)} <span class="c-dim">(12개월 안 대략)</span></dd><dt>닮은 과거</dt><dd>${esc(p.analog)}</dd></dl>
    <ol style="color:var(--fg)">${p.flow.map(x => `<li>${esc(x)}</li>`).join('')}</ol>
    <p class="feel">${esc(p.feel)}</p></section>`).join('');
  // 기간
  $('hz').innerHTML = s.horizons.map(h => { const n = Math.round(h.up / 5);
    return `<div class="gauge"><div class="t">${esc(h.when)}</div><b class="${h.up >= 60 ? 'c-ok' : 'c-warn'}">${h.up}%</b>
      <div class="meter">${Array.from({length: 20}, (_, k) => `<i class="${k < n ? 'on' : ''}"></i>`).join('')}</div><p>${esc(h.why)}</p></div>`; }).join('');
  // 신호
  const sv = id => { const r = m && m.sentiment.find(x => x.id === id); return r ? parseFloat(r.value) : null; };
  const mv = id => { const r = m && m.macro_now.find(x => x.series === id); return r ? r.last : null; };
  const live = {
    calm: () => { const f = sv('fg'), v = sv('vix'); return f == null ? null : {on: f >= 25 && v <= 25, now: `지금 공포·탐욕 ${f} · VIX ${v}`}; },
    rate5: () => { const u = mv('ust10'); return u == null ? null : {on: u >= 5, now: `지금 10년물 ${u}%`}; }
  };
  $('sigs').innerHTML = s.signals.map(g => {
    let led = '', tag = '', now = '';
    if (g.kind === 'live' && live[g.id]) { const r = live[g.id](); if (r) { led = r.on ? 'warn' : ''; tag = r.on ? '<span class="tag c-warn">켜짐</span>' : '<span class="tag c-dim">꺼짐</span>'; now = ' · ' + r.now; } else tag = '<span class="tag c-dim">못 읽음</span>'; }
    else { const on = g.state === 'on'; led = on ? 'warn' : ''; tag = on ? '<span class="tag c-warn">켜짐</span>' : g.state === 'off' ? '<span class="tag c-dim">아님</span>' : '<span class="tag c-blue">대기</span>'; }
    return `<div class="sig"><i class="led ${led}"></i><b>${esc(g.label)}</b>${tag}<small>→ ${esc(g.effect)}${esc(now)}</small></div>`;
  }).join('');
  // 실제 데이터 9번
  const cl = x => /^\+/.test(x) ? 'c-ok' : /^-/.test(x) ? 'c-bad' : '';
  if (s.analogs) { const a = s.analogs;
    $('drop').innerHTML = a.drop.map(r => `<tr><td>${esc(r[0])}</td><td class="c-bad">${esc(r[1])}</td><td class="c-bad">${esc(r[2])}</td><td class="c-bad">${esc(r[3])}</td></tr>`).join('');
    $('anh').innerHTML = a.cols.map(c => `<th>${esc(c)}</th>`).join('');
    $('anb').innerHTML = `<tr class="me">${a.now.map((x, i) => `<td${i >= 5 ? ' class="c-warn"' : ''}>${esc(x)}</td>`).join('')}</tr>` +
      a.rows.map(r => `<tr>${r.map((x, i) => `<td class="${i >= 5 ? cl(x) : ''}">${esc(x)}</td>`).join('')}</tr>`).join('');
    $('ans').innerHTML = a.summary.map(x => `<li>${esc(x)}</li>`).join('');
    $('anc').textContent = a.criteria; }
  // 과거
  $('hist').innerHTML = s.history.map(h => `<tr><td>${esc(h[0])}</td><td class="wrapc">${esc(h[1])}</td><td class="wrapc">${esc(h[2])}</td><td class="wrapc">${esc(h[3])}</td><td class="wrapc c-${h[5]}">${esc(h[4])}</td></tr>`).join('');
  $('lessons').innerHTML = s.lessons.map(x => `<li>${esc(x)}</li>`).join('');
})();
</script>
</body>
</html>
